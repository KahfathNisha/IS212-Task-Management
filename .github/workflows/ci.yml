name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Inject the Firebase service account JSON stored in repo secrets
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IS212_TASK_MANAGEMENT }}
      # Point the server to local emulators so CI doesn't need prod Firebase access
      FIRESTORE_EMULATOR_HOST: localhost:8080
      AUTH_EMULATOR_HOST: localhost:9099
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Firebase Service Account
        run: |
          # Create service account key file and authenticate firebase CLI
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > service-account-key.json
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service-account-key.json"
          # Verify the service account file was created correctly
          ls -la service-account-key.json
          # Test firebase authentication
          firebase projects:list

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Start Firebase Emulators
        run: |
          # Set up service account for emulator authentication
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service-account-key.json"
          # Start emulators in background with proper error logging
          cd backend
          firebase emulators:start --only auth,firestore --project=all-in-one-smu > ../emulator-logs.txt 2>&1 &
          sleep 15  # Increased sleep time to ensure emulators are fully started
          # Check if emulators are running
          ps aux | grep firebase || echo "No firebase processes found"
          # Show emulator logs for debugging
          echo "=== Emulator startup logs ==="
          cat ../emulator-logs.txt

      - name: Start backend
        run: |
          cd backend
          # Start server in background; it will inherit FIRESTORE_EMULATOR_HOST and AUTH_EMULATOR_HOST
          npm run start > ../backend-server.log 2>&1 &
          sleep 8

      - name: Health checks
        run: |
          echo "Performing health checks..."
          MAX_ATTEMPTS=15  # Increased from 10 to 15 attempts
          SLEEP_SECS=4     # Increased from 3 to 4 seconds between attempts

          check_url() {
            local url=$1
            for attempt in $(seq 1 $MAX_ATTEMPTS); do
              if curl -sSf "$url" > /dev/null; then
                echo "OK: $url"
                return 0
              else
                echo "Waiting for $url (attempt $attempt/$MAX_ATTEMPTS)"
                sleep $SLEEP_SECS
              fi
            done
            echo "ERROR: $url did not become available after $MAX_ATTEMPTS attempts"
            return 1
          }

          check_url "http://127.0.0.1:3000/health" || exit 1
          check_url "http://127.0.0.1:9099/" || exit 1
          check_url "http://127.0.0.1:8080/" || exit 1
          echo "All health checks passed."

      - name: Run tests
        # Run backend Jest tests with emulators and servers already running.
        run: |
          export FIRESTORE_EMULATOR_HOST=localhost:8080
          export AUTH_EMULATOR_HOST=localhost:9099

          echo "Running backend integration tests (Jest)"
          (cd backend && npx jest --runInBand --ci)

      - name: Upload server & emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            firestore-debug.log
            auth-debug.log

      - name: Print recent log snippets for quick debugging
        if: failure()
        run: |
          echo "=== firestore-debug.log (last 200 lines) ==="
          if [ -f firestore-debug.log ]; then tail -n 200 firestore-debug.log || true; else echo "(no firestore-debug.log)"; fi
          echo "=== auth-debug.log (last 200 lines) ==="
          if [ -f auth-debug.log ]; then tail -n 200 auth-debug.log || true; else echo "(no auth-debug.log)"; fi
