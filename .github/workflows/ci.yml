name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Start backend
        run: |
          cd backend
          npm run start &
          sleep 10

      - name: Start Firebase Emulators
        run: |
          firebase emulators:start --only auth,firestore --project=all-in-one-smu &
          sleep 10

      - name: Health checks
        run: |
          echo "Performing health checks..."
          for i in 1 2 3; do
            echo "Attempt $i: Checking backend health..."
            curl --fail http://127.0.0.1:3000/health || (echo "Backend health check failed on attempt $i" && exit 1)
            echo "Attempt $i: Checking auth emulator..."
            curl --fail http://127.0.0.1:9099/ || (echo "Auth emulator check failed on attempt $i" && exit 1)
            echo "Attempt $i: Checking firestore emulator..."
            curl --fail http://127.0.0.1:8080/ || (echo "Firestore emulator check failed on attempt $i" && exit 1)
            sleep 2
          done
          echo "All health checks passed."

      - name: Run tests
        # Run backend Jest tests with emulators and servers already running.
        run: |
          export FIRESTORE_EMULATOR_HOST=localhost:8080
          export AUTH_EMULATOR_HOST=localhost:9099

          echo "Running backend integration tests (Jest)"
          (cd backend && npx jest --runInBand --ci)

      - name: Upload server & emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            firestore-debug.log
            auth-debug.log

      - name: Print recent log snippets for quick debugging
        if: failure()
        run: |
          echo "=== firestore-debug.log (last 200 lines) ==="
          if [ -f firestore-debug.log ]; then tail -n 200 firestore-debug.log || true; else echo "(no firestore-debug.log)"; fi
          echo "=== auth-debug.log (last 200 lines) ==="
          if [ -f auth-debug.log ]; then tail -n 200 auth-debug.log || true; else echo "(no auth-debug.log)"; fi
