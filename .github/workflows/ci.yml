
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run emulators + tests (auth, firestore)
        # Run everything under firebase emulators:exec so emulator env vars are injected.
        # This script starts backend+frontend, waits for emulator + servers to be ready,
        # runs Jest and Playwright, then shuts down background servers.
        run: |
          firebase emulators:exec --only auth,firestore --project=all-in-one-smu -- bash -lc '
            set -euo pipefail
            echo "Installing backend deps..."
            (cd backend && npm ci)

            echo "Installing frontend deps..."
            (cd frontend && npm ci)

            echo "Starting backend in background..."
            (cd backend && npm run dev) &
            BACKEND_PID=$!
            echo "Backend PID: $BACKEND_PID"

            echo "Starting frontend in background..."
            (cd frontend && npm run dev) &
            FRONTEND_PID=$!
            echo "Frontend PID: $FRONTEND_PID"

            echo "Waiting for emulators and servers to be ready (may take up to 120s)..."
            # wait for emulator ports and servers
            npx wait-on -t 120000 http://localhost:3000 http://localhost:5173 http://localhost:9099 http://localhost:8080 || true

            echo "Checking emulator endpoints..."
            # Basic health checks with retries
            for i in 1 2 3; do
              curl --fail http://localhost:9099/ || true
              curl --fail http://localhost:8080/ || true
              sleep 1
            done

            echo "Running backend integration tests (Jest)"
            (cd backend && npx jest --runInBand --ci)

            echo "Run Playwright E2E (using existing servers)"
            export PLAYWRIGHT_USE_EXISTING=1
            (cd frontend && npx playwright install --with-deps && npx playwright test --reporter=list)

            echo "Shutting down background servers"
            kill ${BACKEND_PID:-0} || true
            kill ${FRONTEND_PID:-0} || true
          '

      - name: Upload Playwright reports (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report || frontend/test-results || ''
# This workflow runs automatic checks on your frontend and backend code
# when you push to the 'main' branch or open a pull request.
name: CI - Frontend and Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies (Frontend)
        # Use npm ci for faster, more reliable installs in CI
        run: npm ci 

      - name: Run Unit Tests (Frontend)
        # --run tells Vitest to run once and exit
        run: npm test -- --exclude **/*.integration.spec.js --run

      - name: Build Project (Frontend)
        run: npm run build

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies (Backend)
        # Use npm ci for faster, more reliable installs in CI
        run: npm ci

      - name: Run Unit Tests (Backend)
        run: npm test


