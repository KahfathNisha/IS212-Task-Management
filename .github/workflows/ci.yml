name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Inject the Firebase service account JSON stored in repo secrets
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IS212_TASK_MANAGEMENT }}
      # Point the server to local emulators so CI doesn't need prod Firebase access
      FIRESTORE_EMULATOR_HOST: localhost:8080
      AUTH_EMULATOR_HOST: localhost:9099
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Start Firebase Emulators
        run: |
          # Start emulators in background and redirect logs for upload on failure
          cd backend
          firebase emulators:start --only auth,firestore --project=all-in-one-smu > ../emulator-logs.txt 2>&1 &
          sleep 8

      - name: Start backend
        run: |
          cd backend
          # Start server in background; it will inherit FIRESTORE_EMULATOR_HOST and AUTH_EMULATOR_HOST
          npm run start > ../backend-server.log 2>&1 &
          sleep 8

      - name: Health checks
        run: |
          echo "Performing health checks..."
          MAX_ATTEMPTS=10
          SLEEP_SECS=3

          check_url() {
            local url=$1
            for attempt in $(seq 1 $MAX_ATTEMPTS); do
              if curl -sSf "$url" > /dev/null; then
                echo "OK: $url"
                return 0
              else
                echo "Waiting for $url (attempt $attempt/$MAX_ATTEMPTS)"
                sleep $SLEEP_SECS
              fi
            done
            echo "ERROR: $url did not become available after $MAX_ATTEMPTS attempts"
            return 1
          }

          check_url "http://127.0.0.1:3000/health" || exit 1
          check_url "http://127.0.0.1:9099/" || exit 1
          check_url "http://127.0.0.1:8080/" || exit 1
          echo "All health checks passed."

      - name: Run tests
        # Run backend Jest tests with emulators and servers already running.
        run: |
          export FIRESTORE_EMULATOR_HOST=localhost:8080
          export AUTH_EMULATOR_HOST=localhost:9099

          echo "Running backend integration tests (Jest)"
          (cd backend && npx jest --runInBand --ci)

      - name: Upload server & emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            firestore-debug.log
            auth-debug.log

      - name: Print recent log snippets for quick debugging
        if: failure()
        run: |
          echo "=== firestore-debug.log (last 200 lines) ==="
          if [ -f firestore-debug.log ]; then tail -n 200 firestore-debug.log || true; else echo "(no firestore-debug.log)"; fi
          echo "=== auth-debug.log (last 200 lines) ==="
          if [ -f auth-debug.log ]; then tail -n 200 auth-debug.log || true; else echo "(no auth-debug.log)"; fi
