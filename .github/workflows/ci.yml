name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Inject the Firebase service account JSON stored in repo secrets
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IS212_TASK_MANAGEMENT }}
      # Point the server to local emulators so CI doesn't need prod Firebase access
      FIRESTORE_EMULATOR_HOST: localhost:8080
      AUTH_EMULATOR_HOST: localhost:9099
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Removed service account setup - not needed for emulator mode
      # This prevents conflicts between production credentials and emulator expectations

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start Firebase emulators
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$(pwd)/service-account-key.json"
          cd backend
          
          # Start emulators in background; capture logs for upload
          nohup firebase emulators:start \
            --only auth,firestore \
            --project=all-in-one-smu \
            > ../emulator-logs.txt 2>&1 &
          
          echo "Waiting for Firebase emulators to start..."
          
          for i in {1..30}; do
            # quick port check; adjust if your emulator exposes different endpoints
            if nc -z localhost 9099 && nc -z localhost 8080; then
              echo "Firebase emulators are listening on expected ports"
              break
            fi
            echo "Waiting for emulators... attempt $i/30"
            sleep 2
          done
          
          ps aux | grep firebase | grep -v grep || echo "Warning: No firebase processes found"
          echo "=== Emulator startup logs (tail) ==="
          tail -n 200 ../emulator-logs.txt || true

      - name: Start backend server
        run: |
          cd backend
          npm run start > ../backend-server.log 2>&1 &
          sleep 8

      - name: Health checks
        run: |
          echo "Performing health checks..."
          MAX_ATTEMPTS=15
          SLEEP_SECS=4

          check_url() {
            local url=$1
            for attempt in $(seq 1 $MAX_ATTEMPTS); do
              if curl -sSf "$url" > /dev/null; then
                echo "OK: $url"
                return 0
              else
                echo "Waiting for $url (attempt $attempt/$MAX_ATTEMPTS)"
                sleep $SLEEP_SECS
              fi
            done
            echo "ERROR: $url did not become available after $MAX_ATTEMPTS attempts"
            return 1
          }

          check_url "http://127.0.0.1:3000/health" || exit 1
          
          # port-check fallback for emulators (root may not respond with 200)
          for port in 9099 8080; do
            if nc -z 127.0.0.1 $port; then
              echo "Port $port is open"
            else
              echo "ERROR: Port $port not open"
              exit 1
            fi
          done
          echo "All health checks passed."

      - name: Create .env for tests
        # Create a .env file from repository secrets so tests that use dotenv can load SendGrid credentials.
        # Uses secrets you added: SENDGRID_API_KEY and SENDGRID_FROM
        run: |
          cat > .env <<EOF
          SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          EMAIL_TO_TEST=${{ secrets.EMAIL_TO_TEST }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          EOF

      - name: Run backend tests
        run: |
          export FIRESTORE_EMULATOR_HOST=localhost:8080
          export AUTH_EMULATOR_HOST=localhost:9099
          echo "Running backend integration tests (Jest)"
          cd backend
          npx jest --runInBand --ci

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            emulator-logs.txt
            backend-server.log
            firestore-debug.log
            auth-debug.log

      - name: Print debugging logs on failure
        if: failure()
        run: |
          for f in emulator-logs.txt backend-server.log firestore-debug.log auth-debug.log; do
            echo "=== $f (last 200 lines) ==="
            if [ -f "$f" ]; then
              tail -n 200 "$f" || true
            else
              echo "(no $f found)"
            fi
          done