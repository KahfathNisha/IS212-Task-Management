
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run emulators + tests (auth, firestore)
        # Run everything under firebase emulators:exec so emulator env vars are injected.
        # This script starts backend+frontend, waits for emulator + servers to be ready,
        # runs Jest and Playwright, then shuts down background servers.
        run: |
          firebase emulators:exec --only auth,firestore --project=all-in-one-smu -- bash -lc '
            set -euo pipefail
            echo "Installing backend deps..."
            (cd backend && npm ci)

            echo "Installing frontend deps..."
            (cd frontend && npm ci)

            echo "Starting backend in background (logging to backend/backend.log)..."
            (cd backend && npm run dev > backend.log 2>&1) &
            BACKEND_PID=$!
            echo "Backend PID: $BACKEND_PID"

            echo "Starting frontend in background (logging to frontend/frontend.log)..."
            (cd frontend && npm run dev > frontend.log 2>&1) &
            FRONTEND_PID=$!
            echo "Frontend PID: $FRONTEND_PID"

            echo "Waiting for emulators and servers to be ready (may take up to 120s)..."
            # wait for emulator ports and servers (prefer IPv4 addresses to avoid ::1 issues)
            npx wait-on -t 120000 http://127.0.0.1:3000 http://127.0.0.1:5173 http://127.0.0.1:5174 http://127.0.0.1:9099 http://127.0.0.1:8080 || true

            echo "Checking backend and emulator endpoints..."
            # Basic health checks with retries; check backend /health specifically
            for i in 1 2 3; do
              curl --fail http://127.0.0.1:3000/health || true
              curl --fail http://127.0.0.1:9099/ || true
              curl --fail http://127.0.0.1:8080/ || true
              sleep 1
            done

            echo "Running backend integration tests (Jest)"
            (cd backend && npx jest --runInBand --ci)

            echo "Run Playwright E2E (using existing servers)"
            export PLAYWRIGHT_USE_EXISTING=1
            (cd frontend && npx playwright install --with-deps && npx playwright test --reporter=list)

            echo "Shutting down background servers"
            kill ${BACKEND_PID:-0} || true
            kill ${FRONTEND_PID:-0} || true
          '

      - name: Upload Playwright reports (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report || frontend/test-results || ''

      - name: Upload server & emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            backend/backend.log
            frontend/frontend.log
            firestore-debug.log
            auth-debug.log
            backend/firestore-debug.log
            backend/emulator-*.log

      - name: Print recent log snippets for quick debugging
        if: failure()
        run: |
          echo "=== backend/backend.log (last 200 lines) ==="
          if [ -f backend/backend.log ]; then tail -n 200 backend/backend.log || true; else echo "(no backend/backend.log)"; fi
          echo "=== frontend/frontend.log (last 200 lines) ==="
          if [ -f frontend/frontend.log ]; then tail -n 200 frontend/frontend.log || true; else echo "(no frontend/frontend.log)"; fi
          echo "=== firestore-debug.log (last 200 lines) ==="
          if [ -f firestore-debug.log ]; then tail -n 200 firestore-debug.log || true; else echo "(no firestore-debug.log)"; fi
          echo "=== auth-debug.log (last 200 lines) ==="
          if [ -f auth-debug.log ]; then tail -n 200 auth-debug.log || true; else echo "(no auth-debug.log)"; fi


