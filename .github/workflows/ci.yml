
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Start backend
        run: |
          cd backend
          npm run start &
          sleep 10

      - name: Start Firebase Emulators
        run: |
          firebase emulators:start --only auth,firestore --project=all-in-one-smu &
          sleep 10

      - name: Health checks
        run: |
          echo "Performing health checks..."
          for i in 1 2 3; do
            echo "Attempt $i: Checking backend health..."
            curl --fail http://127.0.0.1:3000/health || (echo "Backend health check failed on attempt $i" && exit 1)
            echo "Attempt $i: Checking auth emulator..."
            curl --fail http://127.0.0.1:9099/ || (echo "Auth emulator check failed on attempt $i" && exit 1)
            echo "Attempt $i: Checking firestore emulator..."
            curl --fail http://127.0.0.1:8080/ || (echo "Firestore emulator check failed on attempt $i" && exit 1)
            sleep 2
          done
          echo "All health checks passed."

      - name: Run tests
        # Run tests with emulators and servers already running.
        # This script starts frontend, waits for it to be ready,
        # runs Jest and Playwright, then shuts down frontend.
        run: |
          export FIRESTORE_EMULATOR_HOST=localhost:8080
          export AUTH_EMULATOR_HOST=localhost:9099
          echo "Starting frontend in background (logging to frontend/frontend.log)..."
          (cd frontend && npm run dev > frontend.log 2>&1) &
          FRONTEND_PID=$!
          echo "Frontend PID: $FRONTEND_PID"

          echo "Waiting for frontend to be ready (may take up to 120s)..."
          npx wait-on -t 120000 http://127.0.0.1:5173 http://127.0.0.1:5174 || (echo "Frontend wait-on failed" && exit 1)

          echo "Checking frontend availability..."
          curl --fail http://127.0.0.1:5173/ || (echo "Frontend not responding" && exit 1)

          echo "Running backend integration tests (Jest)"
          (cd backend && npx jest --runInBand --ci)

          echo "Installing Playwright dependencies..."
          (cd frontend && npx playwright install --with-deps)

          echo "Run Playwright E2E (using existing servers)"
          export PLAYWRIGHT_USE_EXISTING=1
          (cd frontend && npx playwright test --reporter=list)

          echo "Shutting down background servers"
          kill ${FRONTEND_PID:-0} || true

      - name: Upload Playwright reports (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report || frontend/test-results || ''

      - name: Upload server & emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            backend/backend.log
            frontend/frontend.log
            firestore-debug.log
            auth-debug.log
            backend/firestore-debug.log
            backend/emulator-*.log

      - name: Print recent log snippets for quick debugging
        if: failure()
        run: |
          echo "=== backend/backend.log (last 200 lines) ==="
          if [ -f backend/backend.log ]; then tail -n 200 backend/backend.log || true; else echo "(no backend/backend.log)"; fi
          echo "=== frontend/frontend.log (last 200 lines) ==="
          if [ -f frontend/frontend.log ]; then tail -n 200 frontend/frontend.log || true; else echo "(no frontend/frontend.log)"; fi
          echo "=== firestore-debug.log (last 200 lines) ==="
          if [ -f firestore-debug.log ]; then tail -n 200 firestore-debug.log || true; else echo "(no firestore-debug.log)"; fi
          echo "=== auth-debug.log (last 200 lines) ==="
          if [ -f auth-debug.log ]; then tail -n 200 auth-debug.log || true; else echo "(no auth-debug.log)"; fi


