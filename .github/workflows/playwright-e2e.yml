name: Playwright E2E (with Firebase emulators)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Playwright tests with emulators
        # Use firebase emulators:exec to run emulators and execute tests against them
        working-directory: backend
        run: |
          npx firebase emulators:exec --only auth,firestore "cd ../frontend && npm run test:e2e"
        env:
          # Ensure firebase uses the project from backend/firebase.json
          CI: true

    # allow the job to use larger timeouts
    timeout-minutes: 30
